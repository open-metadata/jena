# The operator-managed shiro.ini that README.md documents for a non-admin service account
# (FUSEKI_MANAGE_SHIRO=false): it may use the reasoning operations and nothing else. Shiro's roles
# filter needs every listed role, so the admin account carries the reasoning role too.
# ReasoningOperationsIT runs against this file; keep it identical to the README's example.
[main]
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin = admin-pw, admin, reasoning
openmetadata = service-pw, reasoning
reader = reader-pw, reader

[roles]
admin = *

[urls]
/$/ping = anon
/reasoning/** = authcBasic, roles[reasoning]
/** = authcBasic, roles[admin]
