#
# Rendered into $FUSEKI_BASE/shiro.ini at start with ADMIN_PASSWORD. Everything except the health
# ping requires the admin account, including $/metrics, which exposes JVM and request detail.
# Mount your own file with FUSEKI_MANAGE_SHIRO=false for other users or roles.

[main]
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin = ${ADMIN_PASSWORD}, admin

[roles]
admin = *

[urls]
/$/ping = anon
/** = authcBasic, roles[admin]
