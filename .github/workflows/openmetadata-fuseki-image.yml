# Builds, tests and publishes openmetadata/fuseki. Pull requests build and test only. Publishing
# happens only for release/<fuseki-version> branches: on push, or on demand with the branch as input.
# A publish pushes only the immutable <version>-<commit> tag, smoke-tests that pushed digest on amd64
# and arm64, and only then points <version> at the same digest, so the moving tag never names an
# image that was not tested as pushed.
name: OpenMetadata Fuseki image

on:
  push:
    branches:
      - "release/**"
    paths:
      - "openmetadata/fuseki/**"
      - ".github/workflows/openmetadata-fuseki-image.yml"
  pull_request:
    paths:
      - "openmetadata/fuseki/**"
      - ".github/workflows/openmetadata-fuseki-image.yml"
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to build and publish, for example release/6.2.0"
        required: true
        default: "release/6.2.0"

permissions:
  contents: read

concurrency:
  group: openmetadata-fuseki-${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: openmetadata/fuseki
  CONTEXT: openmetadata/fuseki

jobs:
  image:
    runs-on: ubuntu-latest
    # A publish runs the smoke test twice: on the local build, then on the pushed amd64 digest.
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      # Inputs are passed through env, never interpolated into the script, to avoid injection.
      - name: Decide whether this run publishes
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED_BRANCH: ${{ inputs.release_branch }}
          PUSHED_BRANCH: ${{ github.ref_name }}
          PUSHED_COMMIT: ${{ github.sha }}
        run: |
          publish=false
          branch=""
          checkout=""
          if [ "$EVENT" != "pull_request" ]; then
            branch="$PUSHED_BRANCH"
            checkout="$PUSHED_COMMIT"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              branch="$DISPATCHED_BRANCH"
              checkout="$DISPATCHED_BRANCH"
            fi
            if [[ ! "$branch" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Images are published only from release/<version> branches, not '$branch'"
              exit 1
            fi
            publish=true
          fi
          {
            echo "publish=$publish"
            echo "branch=$branch"
            echo "checkout=$checkout"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.checkout }}

      - name: Check the release branch matches the pinned Fuseki version
        id: version
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          PUBLISH: ${{ steps.target.outputs.publish }}
        run: |
          pinned=$(sed -n 's/^ARG FUSEKI_VERSION=//p' "$CONTEXT/Dockerfile")
          if [ "$PUBLISH" = "true" ] && [ "${BRANCH#release/}" != "$pinned" ]; then
            echo "::error::$BRANCH must build Fuseki ${BRANCH#release/}, but the Dockerfile pins $pinned"
            exit 1
          fi
          {
            echo "version=$pinned"
            echo "commit=$(git rev-parse --short=7 HEAD)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            openmetadata/fuseki/extension/pom.xml
            openmetadata/fuseki/reasoner/pom.xml

      - name: Test the extension
        working-directory: openmetadata/fuseki/extension
        run: mvn -B -ntp verify

      # OpenMetadata's HermiT build has no release yet: install it from the commit the Dockerfile
      # pins, so the reasoner tests use exactly what the image ships.
      - name: Build HermiT at the commit the image pins
        run: |
          repository=$(sed -n 's/^ARG HERMIT_REPOSITORY=//p' "$CONTEXT/Dockerfile")
          commit=$(sed -n 's/^ARG HERMIT_COMMIT=//p' "$CONTEXT/Dockerfile")
          hermit="$RUNNER_TEMP/hermit"
          git init --quiet "$hermit"
          git -C "$hermit" fetch --quiet --depth 1 "$repository" "$commit"
          git -C "$hermit" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$hermit" rev-parse HEAD)" = "$commit"
          cd "$hermit"
          mvn -B -ntp -Dmaven.test.skip=true -Dmaven.javadoc.skip=true install

      - name: Test the reasoner
        working-directory: openmetadata/fuseki/reasoner
        run: mvn -B -ntp verify

      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          load: true
          tags: openmetadata-fuseki:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        working-directory: ${{ env.CONTEXT }}
        run: ./test/smoke-test.sh openmetadata-fuseki:smoke

      - name: Check Docker Hub credentials
        if: steps.target.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_OPENMETADATA_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_OPENMETADATA_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add DOCKERHUB_OPENMETADATA_USERNAME and DOCKERHUB_OPENMETADATA_TOKEN to this repository's Actions secrets"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.target.outputs.publish == 'true'

      - uses: docker/login-action@v4
        if: steps.target.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_OPENMETADATA_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OPENMETADATA_TOKEN }}

      # Only the immutable tag: the promote job moves <version> once both architectures pass.
      - name: Publish
        id: publish
        if: steps.target.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit }}
          cache-from: type=gha

      - name: Pull the pushed amd64 image by digest
        if: steps.target.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish step reported no image digest: '$DIGEST'"
            exit 1
          fi
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE@$DIGEST")" = "amd64"

      - name: Smoke test the pushed amd64 image
        if: steps.target.outputs.publish == 'true'
        working-directory: ${{ env.CONTEXT }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: ./test/smoke-test.sh "$IMAGE@$DIGEST"

  # The same pushed digest on a native arm64 runner; QEMU emulation built it but never ran it.
  smoke-arm64:
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      # The smoke test reads the reasoner's conformance fixtures from the commit the image was built from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.image.outputs.sha }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_OPENMETADATA_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OPENMETADATA_TOKEN }}

      - name: Pull the pushed arm64 image by digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker pull --platform linux/arm64 "$IMAGE@$DIGEST"
          test "$(docker image inspect -f '{{.Architecture}}' "$IMAGE@$DIGEST")" = "arm64"

      - name: Smoke test the pushed arm64 image
        working-directory: ${{ env.CONTEXT }}
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: ./test/smoke-test.sh "$IMAGE@$DIGEST"

  # Retags the tested manifest list without rebuilding: a single-source imagetools create copies it
  # unchanged, so <version> resolves to exactly the digest both smoke tests ran.
  promote:
    needs: [image, smoke-arm64]
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_OPENMETADATA_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OPENMETADATA_TOKEN }}

      - name: Point the release tag at the tested digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          promoted=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$VERSION" | jq -r .digest)
          if [ "$promoted" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$VERSION resolves to $promoted, not the tested $DIGEST"
            exit 1
          fi
          echo "$IMAGE:$VERSION -> $DIGEST"
